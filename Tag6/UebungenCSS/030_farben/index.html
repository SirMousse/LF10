<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>FIAE Vokabeln</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>FIAE Vokabeltraining</h1>
        <h2>Welche Farbe hat dein Code heute?</h2>
    </header>

    <main>

        <section>

            <!-- BLAU -->
            <h2 class="begriff" id="frontend">Frontend</h2>
            <img src="./assets/images/blue.png" alt="Blau">


            <!-- GRÜN -->
            <h2 class="begriff" id="database">Datenbank</h2>
            <img src="./assets/images/green.png" alt="Grün">


            <!-- ORANGE -->
            <h2 class="begriff" id="debugging">Debugging</h2>
            <img src="./assets/images/orange.png" alt="Orange">


            <!-- ROT -->
            <h2 class="begriff" id="bug">Bug</h2>
            <img src="./assets/images/red.png" alt="Rot">


            <!-- GELB -->
            <h2 class="begriff" id="backend">Backend</h2>
            <img src="./assets/images/yellow.png" alt="Gelb">

        </section>

    </main>

    <footer>
        <p>
            Wenn alles rot ist, war es vermutlich kein Feature.
        </p>
    </footer>


    <!--
    ==========================================================
    FIAE CSS CHALLENGE
    ==========================================================

    WICHTIG:

    Die index.html darf NICHT verändert werden!

    Alle Aufgaben werden ausschließlich in der
    Datei style.css gelöst.

    Kein Inline-CSS.
    Keine Änderungen am HTML.
    Keine Ausreden.


    ----------------------------------------------------------
    AUFGABE 1 – DIE FIAE-BEGRIFFE
    ----------------------------------------------------------

    Alle Überschriften mit der Klasse "begriff"
    sollen nicht mehr fett dargestellt werden.

    Tipp:
    Verwende einen Klassenselektor.


    ----------------------------------------------------------
    AUFGABE 2 – FRONTEND
    ----------------------------------------------------------

    Unter "Frontend" befindet sich ein blaues Bild.

    Die Schriftfarbe von "Frontend" soll ebenfalls
    blau werden.

    Tipp:
    Verwende die ID des Elements.


    ----------------------------------------------------------
    AUFGABE 3 – DATENBANK
    ----------------------------------------------------------

    Unter "Datenbank" befindet sich ein grünes Bild.

    Die Schriftfarbe von "Datenbank" soll ebenfalls
    grün werden.

    Tipp:
    Verwende die ID des Elements.


    ----------------------------------------------------------
    AUFGABE 4 – DEBUGGING
    ----------------------------------------------------------

    Unter "Debugging" befindet sich ein oranges Bild.

    Die Schriftfarbe von "Debugging" soll ebenfalls
    orange werden.

    Debugging ist schließlich schon stressig genug.


    ----------------------------------------------------------
    AUFGABE 5 – BUG
    ----------------------------------------------------------

    Unter "Bug" befindet sich ein rotes Bild.

    Die Schriftfarbe von "Bug" soll ebenfalls
    rot werden.

    Rot passt.
    Weitere Erklärungen sind nicht notwendig.


    ----------------------------------------------------------
    AUFGABE 6 – BACKEND
    ----------------------------------------------------------

    Unter "Backend" befindet sich ein gelbes Bild.

    Die Schriftfarbe von "Backend" soll ebenfalls
    gelb werden.

    Tipp:
    Auch hier hilft dir die ID.


    ----------------------------------------------------------
    AUFGABE 7 – BILDER
    ----------------------------------------------------------

    Alle Bilder sollen ausschließlich mit CSS
    auf dieselbe Größe gebracht werden.

    Breite:
    200 Pixel

    Höhe:
    200 Pixel

    Verwende dafür einen Elementselektor.

    Die Größen dürfen NICHT direkt in die
    HTML-Elemente geschrieben werden.


    ----------------------------------------------------------
    BONUS
    ----------------------------------------------------------

    Alle Bilder sollen leicht abgerundete
    Ecken bekommen.

    Radius:
    10 Pixel


    ----------------------------------------------------------
    DEBUGGING-HILFE
    ----------------------------------------------------------

    Falls nichts funktioniert:

    1. Ist die style.css richtig eingebunden?

    2. Stimmt dein Selektor?

    3. Hast du Semikolons vergessen?

    4. Sind alle geschweiften Klammern geschlossen?

    5. Hast du die HTML-Datei verändert?
       Dann hat die HTML-Polizei bereits eine Akte angelegt.

    ==========================================================
    -->

</body>

</html>
