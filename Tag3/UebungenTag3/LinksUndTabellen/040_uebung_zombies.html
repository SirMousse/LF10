============================================================
AUFGABE: DIE ZOMBIE-ÜBERLEBENSSTATION
============================================================

Dauer: ca. 45 Minuten
Level: Anfänger bis leicht fortgeschritten

Themen:
- Tabellen
- Links
- Sprungmarken
- E-Mail- und Telefon-Links
- target und rel
- colspan und rowspan
- kleine Recherche-Aufgaben


DIE GESCHICHTE
------------------------------------------------------------

Die Zombie-Apokalypse hat begonnen.

Du bist in der letzten sicheren Forschungsstation
"Safe Zone 42" gelandet.

Leider funktioniert die Webseite der Station nicht mehr.
Niemand findet Vorräte, Einsatzpläne oder wichtige
Kontaktdaten.

Deine Aufgabe:

Erstelle eine neue HTML-Seite namens

zombies.html

und bring Ordnung in die Überlebensstation.


============================================================
LEVEL 1 - DIE VORRÄTE
ca. 7 Minuten
============================================================

Erstelle die Überschrift:

"Unsere Vorräte"

Darunter soll eine Tabelle mit folgenden Daten entstehen:


Gegenstand          Anzahl      Zustand
------------------------------------------------
Wasserflaschen      24          gut
Konservendosen      18          essbar
Taschenlampen       5           fast voll
Schokoriegel        2           streng bewacht


Die Tabelle soll die Beschriftung

"Vorräte der Safe Zone 42"

bekommen.


ANFORDERUNGEN:

Verwende:

- <table>
- <caption>
- <tr>
- <th>
- <td>

Die Spaltenüberschriften sollen außerdem das passende
scope-Attribut erhalten.


============================================================
LEVEL 2 - DIE SICHEREN ORTE
ca. 6 Minuten
============================================================

Außerhalb der Station gibt es drei mögliche Zufluchtsorte.

Erstelle die Überschrift:

"Sichere Orte"

Darunter sollen drei Links stehen:


1. "Zum Bunker"
   Ziel: bunker.html

2. "Zum Krankenhaus"
   Ziel: krankenhaus.html

3. "Zum verlassenen Supermarkt"
   Ziel: supermarkt.html


Erstelle danach noch einen Link zu:

https://de.wikipedia.org/wiki/Zombie

Dieser Link soll sich in einem NEUEN TAB öffnen.

Achte dabei auch auf die passenden Werte für das
rel-Attribut.


============================================================
LEVEL 3 - NOTFALLKONTAKT
ca. 6 Minuten
============================================================

Ein Überlebender möchte Kontakt mit der Station aufnehmen.


TEIL 1: E-MAIL

Erstelle einen Link, der das E-Mail-Programm öffnet.

E-Mail-Adresse:

notfall@safezone42.de

Der Betreff soll bereits eingetragen sein:

Dringende Hilfe

Der Nachrichtentext soll bereits enthalten:

Hallo Safe Zone 42,

ich brauche Unterstützung.


TEIL 2: TELEFON

Erstelle zusätzlich einen Telefon-Link.

Telefonnummer:

+49123456789

Der sichtbare Linktext soll sein:

"Notfallzentrale anrufen"


============================================================
LEVEL 4 - DER EINSATZPLAN
ca. 7 Minuten
============================================================

Die Überlebenden müssen ihre Aufgaben organisieren.

Erstelle folgende Tabelle:


Person          Aufgabe             Bereich
------------------------------------------------
Mira            Wache               Eingang
Ben             Vorräte prüfen      Lager
Sam             Funkkontakt         Zentrale
Alex            Erste Hilfe         Krankenraum


Baue diese Tabelle mit:

- <thead>
- <tbody>
- <tfoot>


Im Fußbereich soll stehen:

"Nach Sonnenuntergang bleibt das Haupttor geschlossen."


ACHTUNG:

Dieser Satz soll sich über ALLE DREI SPALTEN erstrecken.


DENKFRAGE:

Welches HTML-Attribut brauchst du dafür?


============================================================
LEVEL 5 - DER ÜBERLEBENSPLAN
ca. 7 Minuten
============================================================

Erstelle folgende Tabelle:


Tag          Vormittag              Nachmittag
------------------------------------------------------
Montag       Vorräte suchen         Barrikaden prüfen
Dienstag     Vorräte suchen         Funkgerät testen
Mittwoch     Bunker sichern         Bunker sichern


ABER:

"Vorräte suchen" darf nur EINMAL in deinem HTML-Code
stehen.

Es soll trotzdem für Montag UND Dienstag gelten.


Auch "Bunker sichern" darf nur EINMAL im HTML-Code
stehen.

Es soll aber Vormittag UND Nachmittag belegen.


RECHERCHE-AUFGABE:

Finde heraus:

Was ist der Unterschied zwischen

rowspan

und

colspan

?


Benutze anschließend beide Attribute richtig in deiner
Tabelle.


============================================================
LEVEL 6 - SCHNELL DURCH DIE SAFE ZONE
ca. 7 Minuten
============================================================

Ganz unten auf deiner Webseite befindet sich der Bereich:

"Notfallausgang"


Ganz oben auf deiner Webseite soll ein Link stehen:

"Direkt zum Notfallausgang"


Beim Anklicken soll der Browser direkt zu diesem Bereich
springen.


Beim Notfallausgang soll außerdem ein Link stehen:

"Zurück zu den Vorräten"


Dieser Link soll zurück zur ersten Tabelle springen.


ANFORDERUNG:

Benutze dafür:

- id
- href="#..."


============================================================
FINAL BOSS - DER EVAKUIERUNGSPLAN
ca. 5 Minuten
============================================================

Die Station besitzt einen geheimen Evakuierungsplan.

Jetzt musst du selbst etwas Neues herausfinden.


RECHERCHE:

Wie kann man mit einem Link eine Datei zum Download
anbieten?


Suche nach dem HTML-Attribut:

download


Erstelle anschließend einen Link zur Datei:

evakuierungsplan.pdf


Der sichtbare Linktext soll sein:

"Evakuierungsplan herunterladen"


ZUSATZFRAGE:

Was passiert, wenn die Datei "evakuierungsplan.pdf"
gar nicht im richtigen Ordner liegt?
