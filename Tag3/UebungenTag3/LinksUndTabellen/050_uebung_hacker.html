============================================================
AUFGABE: DIE HACKER-ZENTRALE
============================================================

Dauer: ca. 45 Minuten

DIE GESCHICHTE
------------------------------------------------------------

Du arbeitest heute in der geheimen IT-Zentrale
"Code Vault 404".

Keine Sorge:
Hier wird nichts Illegales gemacht.

Ihr kümmert euch um Testsysteme, sichere Netzwerke
und kleine Übungsprojekte.

Leider ist die interne Webseite der Zentrale kaputt.
Niemand findet Geräte, Aufgaben oder wichtige
Kontaktdaten.

Deine Aufgabe:

Erstelle eine neue HTML-Seite namens

hacker.html

und bring Ordnung in die Code Vault 404.

ca. 7 Minuten

Gerät               Anzahl      Status
------------------------------------------------
Laptop              6           bereit
USB-Stick           12          geprüft
Router              3           aktiv
Gummiente           1           kritisch wichtig


Die Tabelle soll die Beschriftung

"Ausrüstung der Code Vault 404"

bekommen.

- <table>

- <tr>
