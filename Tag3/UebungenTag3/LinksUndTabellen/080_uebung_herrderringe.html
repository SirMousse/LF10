<!--
============================================================
AUFGABE: DIE REISE DURCH MITTELERDE
============================================================

Dauer: ca. 45 Minuten
Level: Anfänger bis leicht fortgeschritten

Themen:
- Tabellen
- Links
- Sprungmarken
- E-Mail- und Telefon-Links
- target und rel
- colspan und rowspan
- kleine Recherche-Aufgaben


DIE GESCHICHTE
------------------------------------------------------------

Du begleitest eine kleine Gemeinschaft auf ihrer Reise durch Mittelerde.

Doch die Reiseplanung ist chaotisch:
Vorräte fehlen, Wege sind unklar und wichtige Informationen sind über mehrere Orte verteilt.

Deine Aufgabe:

Erstelle eine neue HTML-Seite namens

mittelerde.html

und bring Ordnung in die Reise.


============================================================
LEVEL 1 - DIE AUSRÜSTUNG DER GEMEINSCHAFT
ca. 7 Minuten
============================================================

Erstelle die Überschrift:

"Unsere Ausrüstung"

Darunter soll eine Tabelle mit folgenden Daten entstehen:


Gegenstand          Anzahl      Besitzer
------------------------------------------------
Elbenseil           2           Sam
Bogen               1           Legolas
Axt                 1           Gimli
Lembas              12          Gemeinschaft


Die Tabelle soll die Beschriftung

"Ausrüstung für die Reise durch Mittelerde"

bekommen.


ANFORDERUNGEN:

Verwende:

- <table>
- <caption>
- <tr>
- <th>
- <td>

Die Spaltenüberschriften sollen außerdem das passende scope-Attribut erhalten.


============================================================
LEVEL 2 - DIE ORTE VON MITTELERDE
ca. 6 Minuten
============================================================

Auf eurer Reise gibt es mehrere wichtige Orte.

Erstelle die Überschrift:

"Reiseziele"

Darunter sollen drei Links stehen:


1. "Nach Bruchtal reisen"
    Ziel: bruchtal.html

2. "Nach Moria reisen"
    Ziel: moria.html

3. "Nach Gondor reisen"
    Ziel: gondor.html


Erstelle danach noch einen Link zu:

https://de.wikipedia.org/wiki/Der_Herr_der_Ringe

Dieser Link soll sich in einem NEUEN TAB öffnen.

Achte dabei auch auf die passenden Werte für das rel-Attribut.


============================================================
LEVEL 3 - NACHRICHT AN GANDALF
ca. 6 Minuten
============================================================

Die Gemeinschaft muss dringend Gandalf erreichen.


TEIL 1: E-MAIL

Erstelle einen Link, der das E-Mail-Programm öffnet.

E-Mail-Adresse:

gandalf@mittelerde.de

Der Betreff soll bereits eingetragen sein:

Dringende Nachricht aus Mittelerde

Der Nachrichtentext soll bereits enthalten:

Hallo Gandalf,

wir brauchen deine Hilfe auf unserer Reise.


TEIL 2: TELEFON

Erstelle zusätzlich einen Telefon-Link.

Telefonnummer:

+49123456789

Der sichtbare Linktext soll sein:

"Gandalf anrufen"


============================================================
LEVEL 4 - DIE REISEVORRÄTE
ca. 7 Minuten
============================================================

Die Gemeinschaft muss ihre Vorräte überprüfen.

Erstelle folgende Tabelle:


Vorrat           Menge        Zustand
------------------------------------------------
Lembas            12          frisch
Wasser            8 Flaschen  ausreichend
Äpfel             6           leicht zerdrückt
Kartoffeln         10          Sam bewacht sie


Baue diese Tabelle mit:

- <thead>
- <tbody>
- <tfoot>


Im Fußbereich soll stehen:

"Die Vorräte müssen bis Mordor reichen."


ACHTUNG:

Dieser Satz soll sich über ALLE DREI SPALTEN erstrecken.


DENKFRAGE:

Welches HTML-Attribut brauchst du dafür?


============================================================
LEVEL 5 - DER REISEPLAN
ca. 7 Minuten
============================================================

Erstelle folgende Tabelle:


Tag          Vormittag             Nachmittag
------------------------------------------------------
Montag       Durch den Wald        Rast am Fluss
Dienstag     Durch den Wald        Berge überqueren
Mittwoch     Moria erkunden        Moria erkunden


ABER:

"Durch den Wald" darf nur EINMAL in deinem HTML-Code
stehen.

Es soll trotzdem für Montag UND Dienstag gelten.


Auch "Moria erkunden" darf nur EINMAL im HTML-Code
stehen.

Es soll aber Vormittag UND Nachmittag belegen.


RECHERCHE-AUFGABE:

Finde heraus:

Was ist der Unterschied zwischen

rowspan

und

colspan

?


Benutze anschließend beide Attribute richtig in deiner
Tabelle.


============================================================
LEVEL 6 - DER SCHNELLWEG ZUM SCHICKSALSBERG
ca. 7 Minuten
============================================================

Ganz unten auf deiner Webseite befindet sich der Bereich:

"Schicksalsberg"


Ganz oben auf deiner Webseite soll ein Link stehen:

"Direkt zum Schicksalsberg"


Beim Anklicken soll der Browser direkt zu diesem Bereich
springen.


Beim Schicksalsberg soll außerdem ein Link stehen:

"Zurück zur Ausrüstung"


Dieser Link soll zurück zur ersten Tabelle springen.


ANFORDERUNG:

Benutze dafür:

- id
- href="#..."


============================================================
FINAL BOSS - DIE KARTE VON MITTELERDE
ca. 5 Minuten
============================================================

Du findest eine alte Karte von Mittelerde.

Sie soll als Datei auf der Webseite bereitgestellt werden.

Jetzt musst du selbst etwas Neues herausfinden.


RECHERCHE:

Wie kann man mit einem Link eine Datei zum Download
anbieten?


Suche nach dem HTML-Attribut:

download


Erstelle anschließend einen Link zur Datei:

karte-von-mittelerde.pdf


Der sichtbare Linktext soll sein:

"Karte von Mittelerde herunterladen"


ZUSATZFRAGE:

Was passiert, wenn die Datei
"karte-von-mittelerde.pdf"
gar nicht im richtigen Ordner liegt?


============================================================
BONUS-LEVEL
============================================================

Wenn du früher fertig bist:

Erstelle ganz oben auf deiner Webseite eine Navigation.


Sie soll folgende Links enthalten:

Ausrüstung | Reiseziele | Vorräte | Reiseplan | Schicksalsberg


Beim Anklicken soll man direkt zum entsprechenden Bereich
auf DEINER Webseite springen.


Dafür musst du eventuell zusätzliche id-Attribute
verwenden.


============================================================
QUEST-CHECK
============================================================

Kontrolliere deine Webseite:

[ ] HTML-Grundstruktur vorhanden

[ ] Tabellen funktionieren

[ ] <th> und <td> sinnvoll verwendet

[ ] scope verwendet

[ ] <thead>, <tbody> und <tfoot> verwendet

[ ] colspan verwendet

[ ] rowspan verwendet

[ ] Links zu anderen Dateien erstellt

[ ] Externen Link erstellt

[ ] target="_blank" verwendet

[ ] rel verwendet

[ ] mailto-Link erstellt

[ ] tel-Link erstellt

[ ] Sprungmarken mit id erstellt

[ ] download selbst recherchiert

[ ] Webseite im Browser getestet


============================================================
GESCHAFFT?
============================================================

Wenn alle Tabellen korrekt angezeigt werden und deine
Links funktionieren, ist die Reise durch Mittelerde
sauber geplant.

Falls etwas nicht funktioniert:

Nicht sofort alles löschen.

Untersuche deinen Code.
Finde heraus, bei welcher Aufgabe der Fehler steckt.
Teste deine Lösung erneut im Browser.
============================================================
-->
