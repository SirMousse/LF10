<!--
============================================================
AUFGABE: DAS DINO-FORSCHUNGSABENTEUER
============================================================

Dauer: ca. 45 Minuten
Level: Anfänger bis leicht fortgeschritten

Themen:
- Tabellen
- Links
- Sprungmarken
- E-Mail- und Telefon-Links
- target und rel
- colspan und rowspan
- kleine Recherche-Aufgaben


DIE GESCHICHTE
------------------------------------------------------------

Du arbeitest heute in der Forschungsstation
"Jurassic Code".

Das Problem:

Die Webseite der Dino-Forschungsstation ist unvollständig.
Niemand findet die Dinosaurier, die Fütterungspläne oder
die Kontaktdaten.

Deine Aufgabe:

Erstelle eine neue HTML-Seite namens

dinos.html

und bring Ordnung in die Forschungsstation.


============================================================
LEVEL 1 - DIE DINOS IM ÜBERBLICK
ca. 7 Minuten
============================================================

Erstelle die Überschrift:

"Unsere Dinosaurier"

Darunter soll eine Tabelle mit folgenden Daten entstehen:


Name            Art                  Größe
------------------------------------------------
Rexi            Tyrannosaurus Rex    12 Meter
Spike           Triceratops          9 Meter
Fluffy          Velociraptor         2 Meter
Longneck        Brachiosaurus        22 Meter


Die Tabelle soll die Beschriftung

"Dinosaurier der Forschungsstation"

bekommen.


ANFORDERUNGEN:

Verwende:

- <table>
- <caption>
- <tr>
- <th>
- <td>

Die Spaltenüberschriften sollen außerdem das passende
scope-Attribut erhalten.


============================================================
LEVEL 2 - DIE DINO-PROFILE
ca. 6 Minuten
============================================================

Besucher möchten mehr über einzelne Dinosaurier erfahren.

Erstelle die Überschrift:

"Dino-Profile"

Darunter sollen drei Links stehen:


1. "Mehr über Rexi"
   Ziel: rexi.html

2. "Mehr über Spike"
   Ziel: spike.html

3. "Mehr über Fluffy"
   Ziel: fluffy.html


Erstelle danach noch einen Link zu:

https://de.wikipedia.org/wiki/Dinosaurier

Dieser Link soll sich in einem NEUEN TAB öffnen.

Achte dabei auch auf die passenden Werte für das
rel-Attribut.


============================================================
LEVEL 3 - KONTAKT ZUR FORSCHUNGSSTATION
ca. 6 Minuten
============================================================

Ein Besucher möchte die Forschungsstation kontaktieren.


TEIL 1: E-MAIL

Erstelle einen Link, der das E-Mail-Programm öffnet.

E-Mail-Adresse:

kontakt@jurassic-code.de

Der Betreff soll bereits eingetragen sein:

Frage zu einem Dinosaurier

Der Nachrichtentext soll bereits enthalten:

Hallo Forschungsteam,

ich habe eine Frage zu einem Dinosaurier.


TEIL 2: TELEFON

Erstelle zusätzlich einen Telefon-Link.

Telefonnummer:

+49123456789

Der sichtbare Linktext soll sein:

"Forschungsstation anrufen"


============================================================
LEVEL 4 - DER FÜTTERUNGSPLAN
ca. 7 Minuten
============================================================

Die Dinosaurier müssen natürlich gefüttert werden.

Erstelle folgende Tabelle:


Dino            Futter              Menge
------------------------------------------------
Rexi            Fleisch             80 kg
Spike           Pflanzen            60 kg
Fluffy          Fleisch             20 kg
Longneck        Blätter             150 kg


Baue diese Tabelle mit:

- <thead>
- <tbody>
- <tfoot>


Im Fußbereich soll stehen:

"Alle Dinosaurier bekommen zusätzlich frisches Wasser."


ACHTUNG:

Dieser Satz soll sich über ALLE DREI SPALTEN erstrecken.


DENKFRAGE:

Welches HTML-Attribut brauchst du dafür?


============================================================
LEVEL 5 - DER FORSCHUNGSPLAN
ca. 7 Minuten
============================================================

Erstelle folgende Tabelle:


Tag          Vormittag              Nachmittag
------------------------------------------------------
Montag       Rexi beobachten        Pflanzen sammeln
Dienstag     Rexi beobachten        Eier untersuchen
Mittwoch     Fossilien suchen       Fossilien suchen


ABER:

"Rexi beobachten" darf nur EINMAL in deinem HTML-Code
stehen.

Es soll trotzdem für Montag UND Dienstag gelten.


Auch "Fossilien suchen" darf nur EINMAL im HTML-Code
stehen.

Es soll aber Vormittag UND Nachmittag belegen.


RECHERCHE-AUFGABE:

Finde heraus:

Was ist der Unterschied zwischen

rowspan

und

colspan

?


Benutze anschließend beide Attribute richtig in deiner
Tabelle.


============================================================
LEVEL 6 - SCHNELL DURCH DIE FORSCHUNGSSTATION
ca. 7 Minuten
============================================================

Ganz unten auf deiner Webseite befindet sich der Bereich:

"Kontakt zur Forschungsstation"


Ganz oben auf deiner Webseite soll ein Link stehen:

"Direkt zum Kontakt"


Beim Anklicken soll der Browser direkt zu diesem Bereich
springen.


Beim Kontaktbereich soll außerdem ein Link stehen:

"Zurück zu den Dinosauriern"


Dieser Link soll zurück zur ersten Dino-Tabelle springen.


ANFORDERUNG:

Benutze dafür:

- id
- href="#..."


============================================================
FINAL BOSS - DER GEHEIME FOSSILIENBERICHT
ca. 5 Minuten
============================================================

Die Forschungsstation stellt einen geheimen Bericht
über neue Fossilien bereit.

Jetzt musst du selbst etwas Neues herausfinden.


RECHERCHE:

Wie kann man mit einem Link eine Datei zum Download
anbieten?


Suche nach dem HTML-Attribut:

download


Erstelle anschließend einen Link zur Datei:

fossilienbericht.pdf


Der sichtbare Linktext soll sein:

"Fossilienbericht herunterladen"


ZUSATZFRAGE:

Was passiert, wenn die Datei "fossilienbericht.pdf"
gar nicht im richtigen Ordner liegt?


============================================================
BONUS-LEVEL
============================================================

Wenn du früher fertig bist:

Erstelle ganz oben auf deiner Webseite eine Navigation.


Sie soll folgende Links enthalten:

Dinos | Profile | Fütterung | Forschung | Kontakt


Beim Anklicken soll man direkt zum entsprechenden Bereich
auf DEINER Webseite springen.


Dafür musst du eventuell zusätzliche id-Attribute
verwenden.

============================================================

============================================================

Falls etwas nicht funktioniert:

Nicht sofort alles löschen.

Untersuche deinen Code.
Finde heraus, bei welcher Aufgabe der Fehler steckt.
Teste deine Lösung erneut im Browser.
============================================================
