<!-- =====================================================
        AUFGABE: DAS GROSSE ABENTEUER
        =====================================================

        Achtung, Abenteurerinnen und Abenteurer!

        Eine geheimnisvolle Reise liegt vor euch.

        Unbekannte Länder, verborgene Schätze
        und spannende Herausforderungen warten
        darauf, entdeckt zu werden.

        Eine Webseite muss erstellt werden,
        damit alle Abenteurer wichtige Hinweise,
        Reiseziele und Informationen über ihre
        Expedition finden können.

        Doch bevor das Abenteuer beginnen kann,
        braucht eure Seite ein vollständiges
        HTML-Boilerplate.

        Nur mit der richtigen Grundstruktur kann
        der Browser eure Abenteuerkarte
        korrekt anzeigen.

        EURE MISSION:

        Erstellt eine HTML-Seite über ein
        spannendes Abenteuer.

        Eure Seite MUSS enthalten:

        <!DOCTYPE html>
        <html lang="de">
        <head> mit:
        - UTF-8 Zeichencodierung
        - Viewport-Einstellung
        - passendem Titel

        <body> mit:
        - <header>
        - <main>
        - <footer>

        Im Header:
        - Eine <h1>-Überschrift

        Im Main:
        - Mindestens einen Absatz <p>

        Im Footer:
        - Ein Copyright mit &copy;

        INHALTSIDEEN:

        Überschrift:
        "Willkommen beim großen Abenteuer"

        Absatz:
        "Die Abenteurer durchqueren unbekannte
        Länder, überwinden gefährliche Hindernisse
        und suchen nach einem geheimnisvollen
        verborgenen Schatz."

        Footer:
        "© 2026 Abenteuer-Expedition"

        BONUS-MISSION:

        Fügt einen zweiten Absatz ein mit:
        "Ein HTML-Boilerplate ist wie die
        Ausrüstung eines Abenteurers: Ohne eine
        gute Grundausstattung wird die Reise
        schnell schwierig."

        VIEL ERFOLG, ABENTEURER!

        PACKT EURE AUSRÜSTUNG,
        STUDIERT DIE KARTE
        UND ERSTELLT EURE ERSTE
        ABENTEUER-WEBSEITE!
        ===================================================== -->
