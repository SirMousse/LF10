<!-- =====================================================
        AUFGABE: DIE LEGENDE VON HYRULE
        =====================================================

        Seid gegrüßt, Heldinnen und Helden!

        Dunkle Mächte bedrohen das Königreich Hyrule.

        Eine sichere Webseite muss erstellt werden,
        damit alle Abenteurer wichtige Hinweise,
        sichere Orte und Botschaften auf ihrer
        Reise finden können.

        Doch bevor die Nachricht aus dem Schloss
        übermittelt werden kann, braucht eure
        Seite ein vollständiges HTML-Boilerplate.

        Nur mit der richtigen Grundstruktur kann
        der Browser die Botschaft korrekt anzeigen.

        EURE MISSION:

        Erstellt eine HTML-Seite über ein
        Abenteuer im Königreich Hyrule.

        Eure Seite MUSS enthalten:

        <!DOCTYPE html>
        <html lang="de">
        <head> mit:
        - UTF-8 Zeichencodierung
        - Viewport-Einstellung
        - passendem Titel

        <body> mit:
        - <header>
        - <main>
        - <footer>

        Im Header:
        - Eine <h1>-Überschrift

        Im Main:
        - Mindestens einen Absatz <p>

        Im Footer:
        - Ein Copyright mit &copy;

        INHALTSIDEEN:

        Überschrift:
        "Willkommen im Königreich Hyrule"

        Absatz:
        "Die Abenteurer erkunden alte Tempel,
        sammeln wichtige Gegenstände und suchen
        nach einem Weg, das Königreich vor den
        dunklen Mächten zu beschützen."

        Footer:
        "© 2026 Königreich Hyrule"

        BONUS-MISSION:

        Fügt einen zweiten Absatz ein mit:
        "Ein HTML-Boilerplate ist wie die Ausrüstung
        eines Helden: Ohne eine stabile Grundstruktur
        wird selbst das größte Abenteuer schwierig."

        VIEL ERFOLG, HELDINNEN UND HELDEN!

        PACKT EURE AUSRÜSTUNG,
        ERKUNDET DIE TEMPEL
        UND ERSTELLT EURE ERSTE
        ABENTEUER-WEBSEITE!
        ===================================================== -->
