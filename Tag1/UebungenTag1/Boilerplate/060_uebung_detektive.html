<!-- =====================================================
        AUFGABE: DER GEHEIME FALL
        =====================================================

        Achtung, Detektivinnen und Detektive!

        Ein geheimnisvoller Fall wartet darauf,
        gelöst zu werden.

        Eine sichere Webseite muss erstellt werden,
        damit alle Ermittler wichtige Hinweise,
        Spuren und Informationen zum Fall
        finden können.

        Doch bevor die Ermittlungen beginnen können,
        braucht eure Seite ein vollständiges
        HTML-Boilerplate.

        Nur mit der richtigen Grundstruktur kann
        der Browser die Ermittlungsakte
        korrekt anzeigen.

        EURE MISSION:

        Erstellt eine HTML-Seite über einen
        spannenden Detektivfall.

        Eure Seite MUSS enthalten:

        <!DOCTYPE html>
        <html lang="de">
        <head> mit:
        - UTF-8 Zeichencodierung
        - Viewport-Einstellung
        - passendem Titel

        <body> mit:
        - <header>
        - <main>
        - <footer>

        Im Header:
        - Eine <h1>-Überschrift

        Im Main:
        - Mindestens einen Absatz <p>

        Im Footer:
        - Ein Copyright mit &copy;

        INHALTSIDEEN:

        Überschrift:
        "Willkommen in der Detektivzentrale"

        Absatz:
        "Die Ermittler sammeln Spuren,
        befragen Verdächtige und suchen nach
        Hinweisen, um den geheimnisvollen
        Fall zu lösen."

        Footer:
        "© 2026 Detektivzentrale"

        BONUS-MISSION:

        Fügt einen zweiten Absatz ein mit:
        "Ein HTML-Boilerplate ist wie eine gut
        geordnete Ermittlungsakte: Ohne eine
        klare Grundstruktur gehen wichtige
        Hinweise schnell verloren."

        VIEL ERFOLG, DETEKTIVINNEN UND DETEKTIVE!

        SUCHT NACH SPUREN,
        PRÜFT EURE HINWEISE
        UND ERSTELLT EURE ERSTE
        DETEKTIV-WEBSEITE!
        ===================================================== -->
