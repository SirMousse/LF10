<!--
    ============================================================
    DAS ABENTEUER VON HTMLORIA
    Kapitel 1: Der verschwundene Quellcode

    Arbeitszeit: ca. 30–40 Minuten
    ============================================================

    Du wachst auf.

    Das ist normalerweise noch kein Grund zur Sorge.

    Allerdings liegst du mitten in einem dunklen Wald.
    Neben dir befindet sich ein Rucksack, ein sehr verwirrtes
    Huhn und ein Schild:

        "Willkommen in HTMLoria.
        Bitte nicht den Drachen füttern."

    Du kannst dich an nichts erinnern.

    Plötzlich erscheint ein alter Zauberer.

    "Endlich! Ein Webentwickler!"

    Du erklärst ihm, dass du eigentlich noch Anfänger bist.

    "Gut genug."

    Bevor du widersprechen kannst, erzählt er dir von
    Lord Error 404.

    Er hat den legendären Quellcode von HTMLoria gestohlen.
    Ohne diesen Quellcode verschwinden nach und nach alle
    Webseiten des Königreichs.

    Deine Aufgabe ist klar:

                FINDE LORD ERROR 404.
                HOLE DEN QUELLCODE ZURÜCK.

    Das Huhn kommt übrigens mit.

    Du weißt nicht warum.


    ============================================================
    QUEST 1 – DIE KARTE DES ZAUBERERS
    ============================================================

    Der Zauberer gibt dir eine Karte.

    Darauf steht:

        Dorf verlassen
        Verbotenen Wald durchqueren
        Brücke des schlechten WLANs überqueren
        Höhle des vergessenen Passworts betreten
        Burg von Lord Error 404 erreichen

    Diese Schritte müssen GENAU in dieser Reihenfolge
    durchgeführt werden.

    Erstelle dafür die passende HTML-Liste.

    Aber natürlich gibt es ein Problem.

    Die Karte beginnt aus irgendeinem Grund bei Schritt 5.

    Recherchiere, mit welchem Attribut du dafür sorgen kannst,
    dass deine Liste ebenfalls bei 5 beginnt.

    Anforderungen:

    - Wähle selbst die richtige Listenart.
    - Verwende alle 5 Stationen.
    - Die Nummerierung beginnt bei 5.


    ============================================================
    QUEST 2 – DER HÄNDLER DES VERDÄCHTIGEN INVENTARS
    ============================================================

    Am Waldrand triffst du einen Händler.

    "Für den Kampf gegen Lord Error 404 brauchst du
    selbstverständlich professionelle Ausrüstung."

    Sein Laden verkauft unter anderem:

        Tastatur +3
        20 Meter LAN-Kabel
        Heiltrank
        USB-Stick unbekannter Herkunft

    Mehr hat er gerade nicht.

    Erstelle dein eigenes Abenteuer-Inventar.

    Anforderungen:

    - Verwende eine Liste, bei der die Reihenfolge egal ist.
    - Dein Inventar enthält mindestens 7 Gegenstände.
    - Mindestens 2 Gegenstände müssen etwas mit Computern oder Programmierung zu tun haben.
    - Übernimm höchstens 2 Gegenstände vom Händler.
    - Den Rest musst du selbst erfinden.

    Hinweis:
    Ein echter Held nimmt nur die wirklich wichtigen Dinge mit.

    Niemand weiß allerdings, was wirklich wichtig ist.


    ============================================================
    QUEST 3 – DER VERBOTENE WALD
    ============================================================

    Nach mehreren Stunden erreichst du den Verbotenen Wald.

    Vor dir stehen drei Wege.

    Ein altes Schild zeigt:

        Verbotener Wald

            Linker Weg
                Trollbrücke
                Verlassene Hütte

            Mittlerer Weg
                Sumpf
                Höhle
                    Schatztruhe
                    Schlafender Goblin

            Rechter Weg
                Alter Turm
                ???

    Stelle diese Karte mit VERSCHACHTELTEN HTML-Listen dar.

    Anforderungen:

    - Verwende mindestens einmal <ul>.
    - Verwende mindestens einmal <ol>.
    - Ergänze beim rechten Weg mindestens 2 eigene Orte.
    - Einer dieser Orte muss noch einmal mindestens 2 Unterpunkte besitzen.
    - Achte auf die korrekte Verschachtelung der Listen.

    Du darfst die Geschichte dabei gerne etwas eskalieren lassen.


    ============================================================
    QUEST 4 – DAS RÄTSEL DER ALTEN TÜR
    ============================================================

    Nach einer völlig unnötig langen Wanderung erreichst du
    die Höhle des vergessenen Passworts.

    Eine riesige Steintür versperrt den Eingang.

    Darauf steht:

        NUR WER DIE DREI ALTEN BEGRIFFE KENNT,
        DARF DIE HÖHLE BETRETEN.

        HTML
        CSS
        URL

    Darunter steht etwas kleiner:

        "Googeln ist erlaubt."

    Praktisch.

    Recherchiere:

    - Wofür steht HTML?
    - Wofür steht CSS?
    - Wofür steht URL?
    - Wofür wird jeder Begriff verwendet?

    Stelle deine Ergebnisse als Beschreibungsliste dar.

    Verwende dafür:

        <dl>
        <dt>
        <dd>

    Schreibe die Erklärungen in deinen eigenen Worten.

    Die Tür erkennt Copy & Paste.

    Angeblich.


    ============================================================
    QUEST 5 – LORD ERROR 404
    ============================================================

    Die Tür öffnet sich.

    Dahinter sitzt Lord Error 404 auf einem viel zu großen
    Thron.

    Neben ihm liegt der gestohlene Quellcode.

    "Du willst den Quellcode zurück?"

    Er lacht.

    "Dann musst du zuerst meine fünf Wächter besiegen!"

    Erstelle eine Rangliste mit 5 Gegnern.

    Erfinde die Gegner selbst.

    Beispiele:

        Der Drucker ohne Verbindung
        Das endlose Windows-Update
        Der WLAN-Goblin

    Anforderungen:

    - Verwende eine <ol>.
    - Die Rangliste soll rückwärts nummeriert werden.
    - Recherchiere selbst, welches Attribut dafür benötigt wird.

    BONUS:
    Finde heraus, wie du statt normaler Zahlen
    römische Zahlen verwenden kannst.


    ============================================================
    DAS FINALE
    ============================================================

    Kontrolliere vor dem Kampf:

    [ ] Ich habe eine <ol> verwendet.
    [ ] Ich habe eine <ul> verwendet.
    [ ] Ich habe <dl>, <dt> und <dd> verwendet.
    [ ] Ich habe Listen korrekt verschachtelt.
    [ ] Ich habe mindestens zwei HTML-Attribute verwendet.
    [ ] Ich habe Informationen selbst recherchiert.
    [ ] Mein Code funktioniert im Browser.

    Alles geschafft?

    Lord Error 404 ist besiegt.

    Du greifst nach dem legendären Quellcode.

    Der Zauberer erscheint plötzlich hinter dir.

    "Ausgezeichnet! HTMLoria ist gerettet!"

    Du möchtest gerade fragen, wie du wieder nach Hause kommst.

    Da hörst du hinter dir ein Geräusch.

    Das Huhn hat den Quellcode gefressen.

    ENDE

    ... vorerst.
    ============================================================
-->
