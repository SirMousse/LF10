    ============================================================

    Neben dem Jeep findest du einen Rucksack.

        Wasserflasche

        Einen sehr kleinen Regenschirm.

    - Verwende eine Liste, bei der die Reihenfolge egal ist.

    - Mindestens 2 Gegenstände müssen etwas mit Technik oder Informatik zu tun haben.
    - Erfinde mindestens 4 Gegenstände selbst.

    Mögliche Beispiele:

        GPS-Gerät
        Powerbank
        Tablet mit Dino-Karte
        Funkgerät
        Fernglas
        Erste-Hilfe-Set

    Einen T-Rex als Haustier mitzunehmen zählt

        Dino Island

                    Eingang
                    Kontrollraum
                ???

    - Verwende mindestens einmal <ul>.

        Verlassenes Dino-Labor

        Brutstation

        <dl>
        <dt>
        <dd>
