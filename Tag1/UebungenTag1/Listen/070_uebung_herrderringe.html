    ============================================================
    QUEST 3 – DURCH MORIA
    ============================================================

    Die Gemeinschaft erreicht Moria.

    Vor euch liegen mehrere Wege.

    Auf einer alten Karte steht:

        Moria

            Westtor
                Eingangshalle
                Alte Treppe

            Minen
                Stollen
                Schatzkammer
                    Mithril
                    Alte Truhe

            Tiefen von Moria
                Brücke
                ???

    Stelle diese Karte als VERSCHACHTELTE HTML-LISTE dar.

    Anforderungen:

    - Verwende mindestens einmal <ul>.
    - Verwende mindestens einmal <ol>.
    - Ergänze in den Tiefen von Moria mindestens 2 eigene Orte.
    - Einer dieser Orte soll mindestens 2 weitere Unterpunkte haben.
    - Achte darauf, dass Unterlisten korrekt innerhalb eines <li>-Elements stehen.

    Hinweis:

    Wenn irgendwo plötzlich ein Balrog auftaucht,
    ist das wahrscheinlich kein HTML-Fehler.
