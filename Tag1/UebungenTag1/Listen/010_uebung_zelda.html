    ============================================================
    ABENTEUER: DIE LEGENDE VON HYRULE
    Kapitel 1: Der verschwundene Quellcode

    Arbeitszeit: ca. 30–40 Minuten
    ============================================================

    Du wachst auf.

    Vor dir schwebt eine kleine Fee.

    Sie ruft:

        "HEY! HÖR ZU!"

    Du ignorierst sie.

        "HEY!"

    Du ignorierst sie weiter.

        "HEY! HÖR ZU!"

    Gut.

    Du hörst zu.

    In der Nacht ist etwas Schreckliches passiert:

    Der magische Quellcode von Hyrule wurde gestohlen.

    Seitdem funktionieren die Dinge im Königreich
    nicht mehr richtig.

    Truhen öffnen sich nicht.
    Türen führen in die falschen Räume.
    Hühner sind noch aggressiver als sonst.

    Und irgendwo spielt seit drei Stunden dieselbe Musik.

    Prinzessin Zelda schickt dir eine Nachricht:

        "Finde den Quellcode und bring ihn zum Schloss.

        P.S. Bitte ärgere auf keinen Fall die Hühner."

    Deine Mission:

        DURCHQUERE HYRULE.
        FINDE DEN QUELLCODE.
        RETTE DAS KÖNIGREICH.

    Du bekommst ein Schwert.

    Einen Schild.

    Und überraschend viele HTML-Aufgaben.


    ============================================================
    QUEST 1 – DER WEG DURCH HYRULE
    ============================================================

    Auf einer alten Karte findest du folgende Route:

        Dorf verlassen
        Verlorenen Wald durchqueren
        Kakariko erreichen
        Todesberg überqueren
        Schloss von Hyrule betreten
        Geheime Kammer finden

    Die Stationen müssen in genau dieser Reihenfolge
    besucht werden.

    Erstelle dafür die passende HTML-Liste.

    Auf der Karte beginnt die Nummerierung allerdings bei 5.

    Warum?

    Die ersten vier Teile der Karte hat offenbar
    jemand als Untersetzer benutzt.

    Anforderungen:

    - Entscheide selbst, welche Listenart sinnvoll ist.
    - Verwende alle 6 Stationen.
    - Die Nummerierung soll bei 5 beginnen.
    - Recherchiere selbst, welches HTML-Attribut dafür benötigt wird.


    ============================================================
    QUEST 2 – DEIN ABENTEUER-INVENTAR
    ============================================================

    Bevor du losziehst, öffnest du eine große Truhe.

    Darin findest du:

        Schwert
        Schild
        5 Rubine

    Außerdem:

        Einen einzelnen Socken.

    Du schließt die Truhe wieder.

    Manche Geheimnisse sollten ungelöst bleiben.

    Erstelle dein eigenes Inventar für die Reise.

    Anforderungen:

    - Verwende eine Liste, bei der die Reihenfolge egal ist.
    - Deine Liste enthält mindestens 7 Gegenstände.
    - Mindestens 2 Gegenstände müssen etwas mit Technik oder Informatik zu tun haben.
    - Erfinde mindestens 4 Gegenstände selbst.

    Mögliche Beispiele:

        Magische Powerbank
        Hyrule-GPS
        USB-Stick der Weisheit
        Tablet mit Dungeon-Karte
        Enterhaken
        Trank

    Wichtig:

    999 Holzschwerter zählen nicht als 999 Gegenstände.


    ============================================================
    QUEST 3 – DER TEMPEL DER LISTEN
    ============================================================

    Nach einer langen Reise erreichst du einen
    uralten Tempel.

    Über dem Eingang steht:

        TEMPEL DER LISTEN

    Das klingt nicht besonders gefährlich.

    Das macht ihn irgendwie noch verdächtiger.

    Im Inneren findest du eine Karte:

        Tempel

            Eingangshalle
                Statue
                Verschlossene Tür

            Westflügel
                Rätselraum
                Schatzkammer
                    Große Truhe
                    Kleine Truhe

            Untergeschoss
                Dunkler Gang
                ???

    Stelle den Tempel mit VERSCHACHTELTEN
    HTML-Listen dar.

    Anforderungen:

    - Verwende mindestens einmal <ul>.
    - Verwende mindestens einmal <ol>.
    - Ergänze im Untergeschoss mindestens 2 eigene Räume.
    - Einer deiner Räume muss mindestens 2 weitere Unterpunkte besitzen.
    - Unterlisten müssen korrekt innerhalb eines <li>-Elements stehen.

    Mögliche Räume:

        Raum der 500 Töpfe
        Verlorene Schatzkammer
        Bossraum
        Raum mit verdächtig vielen Hühnern
        Raum, in dem definitiv nichts passiert

    Kleiner Hinweis:

    Wenn auf einer Tür steht:

        "HIER IST KEIN BOSS"

    ist dort wahrscheinlich ein Boss.


    ============================================================
    QUEST 4 – DAS RÄTSEL DER WEISHEIT
    ============================================================

    Du erreichst eine riesige Steintür.

    Drei leuchtende Symbole erscheinen.

    Darunter steht:

        NUR WER DIE DREI BEGRIFFE DER
        ALTEN WEB-MAGIE VERSTEHT,
        DARF DEN TEMPEL BETRETEN.

        HTML
        CSS
        URL

    Du wartest auf einen Hinweis.

    Nichts passiert.

    Die Fee sagt:

        "HEY! HÖR ZU!"

    Du fragst:

        "Kennst du die Antworten?"

    Die Fee:

        "Nein."

    Sehr hilfreich.

    Recherchiere:

    - Wofür steht HTML?
    - Wofür steht CSS?
    - Wofür steht URL?
    - Wofür wird jeder Begriff verwendet?

    Stelle deine Ergebnisse als Beschreibungsliste dar.

    Verwende:

        <dl>
        <dt>
        <dd>

    Schreibe die Erklärungen kurz und
    in deinen eigenen Worten.


    ============================================================
    QUEST 5 – DIE GEGNER VON HYRULE
    ============================================================

    Die Tür öffnet sich.

    Dahinter befindet sich eine Warnung:

        ACHTUNG!

        STARKE GEGNER VORAUS.

    Erstelle eine Rangliste mit 5 Gegnern,
    denen ein Held in Hyrule begegnen könnte.

    Du kannst bekannte Gegner verwenden oder
    eigene erfinden.

    Beispiele:

        Bokoblin
        Oktorok
        Moblin
        Wächter
        Ganondorf

    Anforderungen:

    - Verwende eine <ol>.
    - Die Rangliste soll rückwärts nummeriert werden.
    - Recherchiere selbst, welches HTML-Attribut dafür benötigt wird.

    BONUS:

    Finde heraus, wie du statt normalen Zahlen
    römische Zahlen verwenden kannst.


    ============================================================
    BONUS-QUEST – DAS HYRULE-LEXIKON
    ============================================================

    Falls du noch Zeit hast:

    In einer Bibliothek findest du ein altes Buch.

    Darin stehen:

        Triforce
        Master-Schwert
        Hyrule
        Ganondorf

    Recherchiere, was diese Begriffe im
    Zelda-Universum bedeuten.

    Erstelle daraus eine Beschreibungsliste mit:

        <dl>
        <dt>
        <dd>

    Erkläre jeden Begriff kurz in deinen eigenen Worten.

    EXTRA:

    Ergänze einen weiteren Begriff aus dem
    Zelda-Universum und erkläre ihn ebenfalls.
