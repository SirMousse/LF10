    Es ist 21:37 Uhr.

    Draußen regnet es.

    Natürlich regnet es.
    In Detektivgeschichten regnet es immer.

    Du sitzt gerade in deinem Büro und überlegst, ob der
    Joghurt im Kühlschrank noch essbar ist, als es an der
    Tür klopft.

    Eine geheimnisvolle Person betritt den Raum.

        "Detektiv, wir brauchen Ihre Hilfe."

    Du drehst dich langsam auf deinem Stuhl um.

    Leider etwas zu schnell.

    Du drehst dich einmal komplett im Kreis.

    Nicht besonders geheimnisvoll.

    Die Person legt einen USB-Stick auf deinen Tisch.

        "Heute Nachmittag wurde eine wichtige Datei gestohlen."

        "Wir haben fünf Verdächtige, mehrere Hinweise und absolut keinen Plan."

    Du fragst:

        "Und warum brauchen Sie jemanden, der HTML kann?"

    Die Person schweigt.

        "Das Budget war begrenzt."

    Verständlich.

    Deine Mission:

        UNTERSUCHE DEN TATORT.
        SAMMLE DIE HINWEISE.
        FINDE DEN TÄTER.

    Und bring etwas Ordnung in diesen Fall.


    ============================================================
    FALL 1 – DER ABLAUF DES VERBRECHENS
    ============================================================

    Eine Überwachungskamera hat folgende Ereignisse aufgezeichnet:

        Gebäude wird geöffnet
        Mitarbeiter betreten das Büro
        Strom fällt kurzzeitig aus
        Eine unbekannte Person betritt den Archivraum
        Die Datei verschwindet
        Alarm wird ausgelöst

    Die Reihenfolge ist für deine Ermittlungen wichtig.

    Erstelle daraus die passende HTML-Liste.

    Die Aufzeichnung beginnt allerdings bei Ereignis Nummer 4.

    Die ersten drei Aufnahmen sind verschwunden.

    Sehr verdächtig.

    Anforderungen:

    - Entscheide selbst, welche Listenart sinnvoll ist.
    - Verwende alle 6 Ereignisse.
    - Die Nummerierung beginnt bei 4.
    - Recherchiere selbst, welches HTML-Attribut dafür benötigt wird.


    ============================================================
    FALL 2 – DER DETEKTIVKOFFER
    ============================================================

    Bevor du zum Tatort fährst, brauchst du Ausrüstung.

    In deinem Detektivkoffer befinden sich bereits:

        Taschenlampe
        Notizblock
        Lupe

    Außerdem findest du darin einen Löffel.

    Du kannst dich nicht erinnern, ihn eingepackt zu haben.

    Vielleicht ist der Löffel ein Hinweis.

    Vielleicht hattest du gestern Joghurt.

    Erstelle deine eigene Ausrüstungsliste.

    Anforderungen:

    - Verwende eine Liste, bei der die Reihenfolge egal ist.
    - Deine Liste enthält mindestens 7 Gegenstände.
    - Mindestens 2 Gegenstände müssen etwas mit Technik oder Informatik zu tun haben.
    - Erfinde mindestens 4 Gegenstände selbst.

    Mögliche Beispiele:

        Kamera
        Tablet
        Powerbank
        USB-Stick
        Taschenlampe
        Maßband

    Ein falscher Schnurrbart ist erlaubt.

    Ob er hilfreich ist, musst du selbst entscheiden.


    ============================================================
    FALL 3 – DER TATORT
    ============================================================

    Du erreichst das Gebäude.

    Der Hausmeister gibt dir einen Plan:

        Hauptgebäude

            Erdgeschoss
                Empfang
                Büro

            Erster Stock
                Besprechungsraum
                Archiv
                    Aktenschrank
                    Computer

            Keller
                Lager
                ???

    Stelle diesen Gebäudeplan als
    VERSCHACHTELTE HTML-LISTE dar.

    Anforderungen:

    - Verwende mindestens einmal <ul>.
    - Verwende mindestens einmal <ol>.
    - Ergänze im Keller mindestens 2 eigene Räume.
    - Einer deiner Räume muss mindestens 2 weitere
        Unterpunkte besitzen.
    - Unterlisten müssen korrekt innerhalb eines
        <li>-Elements stehen.

    Mögliche Räume:

        Geheimes Büro
        Technikraum
        Verstaubtes Archiv
        Raum, den angeblich niemand benutzt
        Verdächtig gut beleuchteter Abstellraum

    Hinweis:

    Wenn jemand sagt:

        "Diesen Raum müssen Sie nicht untersuchen."

    solltest du diesen Raum vermutlich untersuchen.


    ============================================================
    FALL 4 – DIE VERSCHLÜSSELTE NACHRICHT
    ============================================================

    Im Archiv findest du einen eingeschalteten Computer.

    Auf dem Bildschirm steht:

        ZUGRIFF GESPERRT

        ZUR IDENTIFIKATION BITTE FOLGENDE
        BEGRIFFE ERKLÄREN:

        HTML
        CSS
        URL

    Du überlegst kurz, ob du einfach "Passwort123"
    ausprobieren sollst.

    Nein.

    Wir sind professionelle Ermittler.

    Recherchiere:

    - Wofür steht HTML?
    - Wofür steht CSS?
    - Wofür steht URL?
    - Wofür wird jeder Begriff verwendet?

    Stelle deine Ergebnisse als Beschreibungsliste dar.

    Verwende:

        <dl>
        <dt>
        <dd>

    Schreibe die Erklärungen kurz und
    in deinen eigenen Worten.


    ============================================================
    FALL 5 – DIE VERDÄCHTIGEN
    ============================================================

    Der Computer wird entsperrt.

    Darauf findest du fünf Namen:

        Professor Pixel
        Frau Byte
        Herr Null
        Dr. Cookie
        Alex Admin

    Alle fünf hatten Zugang zum Gebäude.

    Alle fünf behaupten natürlich:

        "Ich war es nicht."

    Das sagen Verdächtige erstaunlich häufig.

    Erstelle eine Rangliste der 5 Verdächtigen.

    Anforderungen:

    - Verwende eine <ol>.
    - Platz 5 soll zuerst angezeigt werden und
        anschließend bis Platz 1 herunterzählen.
    - Recherchiere selbst, welches HTML-Attribut
        eine nummerierte Liste rückwärts zählen lässt.

    Erfinde zu jedem Verdächtigen außerdem einen kurzen Hinweis.

    Zum Beispiel:

        Professor Pixel
        Hinweis: Seine Zugangskarte wurde im Archiv gefunden.

    Aber Vorsicht:

    Ein Hinweis bedeutet nicht automatisch,
    dass jemand der Täter ist.


    ============================================================
    BONUS-FALL – DIE GEHEIME AKTE
    ============================================================

    Falls du noch Zeit hast:

    Hinter einem Aktenschrank findest du eine Mappe:

        STRENG GEHEIM

        Auf keinen Fall öffnen.

    Als Detektiv weißt du natürlich, was zu tun ist.

    Öffnen.

    Darin befinden sich folgende Begriffe:

        Fingerabdruck
        Alibi
        Motiv
        Indiz

    Recherchiere, was diese vier Begriffe bedeuten.

    Erstelle daraus eine weitere Beschreibungsliste
    mit <dl>, <dt> und <dd>.

    Schreibe die Erklärungen in deinen eigenen Worten.

        Ist er noch gut?
