<!-- =====================================================
AUFGABE: DIE HTML-ZOMBIE-ZONE
=====================================================

Alarm, Überlebende!

Die Zombie-Apokalypse ist ausgebrochen.

Die Straßen sind gefährlich,
Vorräte werden knapp
und überall lauern Zombies.

Damit alle Überlebenden wichtige Hinweise,
Schutzorte und Notfallpläne finden können,
braucht die Sicherheitszone eine gut
strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Sicherheitszone Alpha".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Informationen korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - ÜBERLEBENDER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen in der Sicherheitszone"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Überlebende
- Schutzorte

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Sicherheitszone Alpha"

=====================================================
MITTLERE AUFGABE: STUFE 2 - SCOUT
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Überlebenden.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Alex, der Vorratssammler"

Absatz:
"Alex sucht täglich nach
<strong>Lebensmitteln und Wasser</strong>
für die Sicherheitszone."

Artikel 2:
Überschrift:
"Mia, die Wachpostin"

Absatz:
"Mia beobachtet die Umgebung und warnt
die Gruppe vor <strong>gefährlichen Zombies</strong>."

=====================================================
SCHWERE AUFGABE: STUFE 3 - ZOMBIE-JÄGER
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen lustigen Überlebens-Tipp.

Beispiel:

Überschrift:
"Überlebens-Tipp"

Absatz:
"Bleib leise und halte die Tore geschlossen!

Und vergiss nicht, auch deine HTML-Tags zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - APOKALYPSEN-HELD
=====================================================

Baut eine kleine "Zombie-Überlebens-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation zur Sicherheitszone bauen
- Überlebende im Main-Bereich vorstellen
- Überlebens-Tipp als Aside einfügen
- Vorräte kontrollieren
- Die Tore geschlossen halten

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Schutzorte</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie eine sichere Zombie-Basis:
Header, Main und Footer halten alles zusammen.
Wenn ein Tag fehlt, kann schnell Chaos ausbrechen."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code stabil bleiben.
Und möge kein Zombie eure Tastatur erreichen!

===================================================== -->
