<!-- =====================================================
AUFGABE: DER HTML-DETEKTIVFALL
=====================================================

Willkommen, Detektivinnen und Detektive!

Ein geheimnisvoller Fall wartet darauf,
gelöst zu werden.

Verdächtige Spuren, geheime Hinweise,
verschlossene Räume und rätselhafte Aussagen
müssen untersucht werden.

Damit alle Ermittler wichtige Informationen,
Spuren und Ergebnisse finden können,
braucht die Detektivzentrale eine gut
strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Detektivzentrale".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Hinweise korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - SPURENSUCHER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen in der Detektivzentrale"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Ermittler
- Hinweise

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Detektivzentrale"

=====================================================
MITTLERE AUFGABE: STUFE 2 - ERMITTLER
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Ermittler.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Alex, der Spurenexperte"

Absatz:
"Alex untersucht den Tatort und sucht nach
<strong>verdächtigen Spuren</strong>."

Artikel 2:
Überschrift:
"Mia, die Meisterdetektivin"

Absatz:
"Mia befragt Verdächtige und kombiniert
<strong>wichtige Hinweise</strong>,
um den Fall zu lösen."

=====================================================
SCHWERE AUFGABE: STUFE 3 - MEISTERDETEKTIV
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen Ermittlungs-Tipp.

Beispiel:

Überschrift:
"Detektiv-Tipp"

Absatz:
"Untersuche jeden Hinweis ganz genau!

Und vergiss nicht, auch deine HTML-Tags
sauber zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - CHEFERMITTLER
=====================================================

Baut eine kleine "Ermittlungs-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation für die Detektivzentrale bauen
- Ermittler im Main-Bereich vorstellen
- Detektiv-Tipp als Aside einfügen
- Spuren am Tatort untersuchen
- Den geheimnisvollen Fall lösen

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Hinweise</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie eine gut geordnete Ermittlungsakte:
Header, Main und Footer geben allem seinen Platz.
Wenn ein Tag fehlt, gehen wichtige Hinweise schnell verloren."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code sauber strukturiert bleiben.
Möge euch kein Hinweis entgehen.

Und möge kein fehlender End-Tag
euren nächsten Fall ungelöst lassen!

===================================================== -->
