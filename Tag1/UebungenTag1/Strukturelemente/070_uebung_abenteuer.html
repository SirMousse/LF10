<!-- =====================================================
AUFGABE: DAS GROSSE HTML-ABENTEUER
=====================================================

Willkommen, Abenteurerinnen und Abenteurer!

Eine geheimnisvolle Reise beginnt.

Unbekannte Länder, verborgene Schätze,
alte Ruinen und gefährliche Hindernisse
warten darauf, entdeckt zu werden.

Damit alle Reisenden wichtige Hinweise,
Ziele und Informationen über ihre Expedition
finden können, braucht das Abenteuer
eine gut strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Abenteuer-Expedition".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Informationen korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - ENTDECKER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen beim großen Abenteuer"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Reiseziele
- Expedition

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Abenteuer-Expedition"

=====================================================
MITTLERE AUFGABE: STUFE 2 - SCHATZSUCHER
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Mitglieder der Expedition.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Alex, der Entdecker"

Absatz:
"Alex erkundet unbekannte Gebiete
und sucht nach <strong>verborgenen Schätzen</strong>."

Artikel 2:
Überschrift:
"Mia, die Kartenexpertin"

Absatz:
"Mia plant den Weg der Expedition
und kennt <strong>geheime Pfade</strong>
durch unbekannte Länder."

=====================================================
SCHWERE AUFGABE: STUFE 3 - ABENTEUERPROFI
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen Abenteurer-Tipp.

Beispiel:

Überschrift:
"Abenteurer-Tipp"

Absatz:
"Prüfe immer deine Ausrüstung,
bevor du dich auf den Weg machst!

Und vergiss nicht, auch deine HTML-Tags
sauber zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - LEGENDÄRER ENTDECKER
=====================================================

Baut eine kleine "Abenteuer-Quest-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation für die Expedition bauen
- Abenteurer im Main-Bereich vorstellen
- Abenteurer-Tipp als Aside einfügen
- Eine alte Ruine erkunden
- Den verborgenen Schatz finden

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Reiseziele</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie die Ausrüstung eines Abenteurers:
Header, Main und Footer geben allem eine feste Struktur.
Wenn ein Tag fehlt, wird selbst die beste Reise schnell chaotisch."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code stabil bleiben.
Möge eure Expedition erfolgreich sein.

Und möge kein fehlender End-Tag
euch den Weg zum Schatz versperren!

===================================================== -->
