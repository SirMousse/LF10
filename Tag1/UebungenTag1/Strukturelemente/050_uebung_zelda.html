<!-- =====================================================
AUFGABE: DIE HTML-LEGENDE VON HYRULE
=====================================================

Willkommen, Heldinnen und Helden!

Das Königreich Hyrule ist in Gefahr.

Alte Tempel, geheimnisvolle Wälder,
gefährliche Monster und verborgene Schätze
warten darauf, entdeckt zu werden.

Damit alle Abenteurer wichtige Informationen
über Orte, Aufgaben und ihre Reise finden können,
braucht Hyrule eine gut strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das "Königreich Hyrule".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Hinweise korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - ABENTEURER
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen im Königreich Hyrule"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Die Helden
- Tempel und Orte

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Königreich Hyrule"

=====================================================
MITTLERE AUFGABE: STUFE 2 - HELD
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Helden von Hyrule.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Link, der mutige Held"

Absatz:
"Link reist durch Hyrule und stellt sich
<strong>gefährlichen Gegnern</strong>."

Artikel 2:
Überschrift:
"Zelda, die Prinzessin von Hyrule"

Absatz:
"Zelda beschützt das Königreich mit
<strong>Mut und Weisheit</strong>."

=====================================================
SCHWERE AUFGABE: STUFE 3 - TEMPELWÄCHTER
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen Abenteurer-Tipp.

Beispiel:

Überschrift:
"Helden-Tipp"

Absatz:
"Prüfe deine Ausrüstung, bevor du einen Tempel betrittst!

Und vergiss nicht, auch deine HTML-Tags zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - HELD VON HYRULE
=====================================================

Baut eine kleine "Hyrule-Quest-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation durch Hyrule bauen
- Helden im Main-Bereich vorstellen
- Helden-Tipp als Aside einfügen
- Einen alten Tempel erkunden
- Das Königreich vor dunklen Mächten beschützen

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Tempel und Orte</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie die Ausrüstung eines Helden:
Header, Main und Footer geben ihm seine Struktur.
Wenn ein Tag fehlt, wird selbst das größte Abenteuer schwierig."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code standhaft bleiben.
Möge eure Reise durch Hyrule erfolgreich sein.

Und möge kein fehlender End-Tag
euch den Weg zum nächsten Tempel versperren!

===================================================== -->
