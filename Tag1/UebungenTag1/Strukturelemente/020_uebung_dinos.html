<!-- =====================================================
AUFGABE: DIE HTML-WELT DER DINOSAURIER
=====================================================

Willkommen, mutige Forscherinnen und Forscher!

Tief im Dschungel wurde eine vergessene Welt entdeckt.

Zwischen riesigen Farnen, Vulkanen und uralten Spuren
leben Dinosaurier aus längst vergangenen Zeiten.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Dino-Forschungsstation".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Informationen über die Dinosaurier
korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - DINO-EI
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen in der Dino-Forschungsstation"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Dinosaurier
- Expedition

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Dino-Forschungsstation"

=====================================================
MITTLERE AUFGABE: STUFE 2 - RAPTOR
=====================================================

Erweitert eure Seite um einen Abschnitt
über verschiedene Dinosaurier.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Tyrannosaurus Rex"

Absatz:
"Der Tyrannosaurus Rex war ein
<strong>mächtiger Fleischfresser</strong>
und lebte vor Millionen von Jahren."

Artikel 2:
Überschrift:
"Triceratops"

Absatz:
"Der Triceratops war ein Pflanzenfresser
und besaß <strong>drei auffällige Hörner</strong>."

=====================================================
SCHWERE AUFGABE: STUFE 3 - T-REX
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen lustigen Dino-Hinweis.

Beispiel:

Überschrift:
"Dino-Forscher-Tipp"

Absatz:
"Bleib ruhig, wenn du einen T-Rex siehst!

Und vergiss nicht, deine HTML-Tags zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - DINO-KÖNIG
=====================================================

Baut eine kleine "Dino-Expeditions-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation durch den Dino-Park bauen
- Dinosaurier im Main-Bereich vorstellen
- Forscher-Tipp als Aside einfügen
- Keine Dino-Eier anfassen

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Dinosaurier</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein Dinosaurier-Skelett:
Header, Main und Footer geben ihm seine Struktur.
Wenn ein Tag fehlt, fällt das ganze Gerüst auseinander."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code stabil sein.
Und möge kein T-Rex eure Tastatur fressen!

===================================================== -->
