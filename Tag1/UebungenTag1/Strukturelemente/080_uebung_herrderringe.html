<!-- =====================================================
AUFGABE: DER HTML-RING VON MITTELERDE
=====================================================

Willkommen, mutige Gefährten!

Der Eine Ring wurde gefunden.

Doch der Weg nach Mordor ist gefährlich.
Orks lauern in den Bergen,
Nazgûl suchen nach dem Ring
und Saurons Auge beobachtet Mittelerde.

Damit die Gemeinschaft wichtige Hinweise,
Orte und Informationen über ihre Reise
finden kann, braucht sie eine gut
strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
die "Gemeinschaft des Codes".

Nur wenn eure Webseite sauber aufgebaut ist,
kann der Ring sicher nach Mordor gebracht werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - HOBBIT
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Die Gemeinschaft des Codes"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Die Gefährten
- Weg nach Mordor

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Rat von Elrond"

=====================================================
MITTLERE AUFGABE: STUFE 2 - WALDLÄUFER
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Gefährten.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Frodo, der Ringträger"

Absatz:
"Frodo trägt den <strong>Einen Ring</strong>
und muss ihn nach Mordor bringen."

Artikel 2:
Überschrift:
"Sam, der treue Gefährte"

Absatz:
"Sam bleibt an Frodos Seite und ist ein
<strong>treuer Freund</strong>,
selbst wenn Mordor kein WLAN hat."

=====================================================
SCHWERE AUFGABE: STUFE 3 - ZAUBERER
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen lustigen Hinweis von Gandalf.

Beispiel:

Überschrift:
"Gandalfs HTML-Tipp"

Absatz:
"Du kannst nicht vorbei!

Zumindest nicht ohne geschlossene HTML-Tags."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - RINGTRÄGER
=====================================================

Baut eine kleine "Mordor-Quest-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation durch Mittelerde bauen
- Gefährten im Main-Bereich vorstellen
- Gandalf-Tipp als Aside einfügen
- Den Schicksalsberg erreichen
- Den Ring nicht als Schmuck behalten

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Die Gefährten</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie die Gemeinschaft des Rings:
Header, Main und Footer halten alles zusammen.
Wenn ein Tag fehlt, wird die Reise nach Mordor chaotisch."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code standhaft bleiben.
Möge der Ring sicher nach Mordor gelangen.

Und möge euer Browser niemals rufen:

"DU KANNST NICHT VORBEI!
Fehlender End-Tag!"

===================================================== -->
