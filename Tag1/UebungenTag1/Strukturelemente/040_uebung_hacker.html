<!-- =====================================================
AUFGABE: DAS HTML-CYBER-NETZWERK
=====================================================

Achtung, Operator!

Ein unbekannter Angriff wurde entdeckt.

Im Netzwerk tauchen verdächtige Aktivitäten auf,
Zugänge müssen geschützt
und wichtige Daten gesichert werden.

Damit alle Mitglieder des Cyber-Teams
wichtige Hinweise und Sicherheitsprotokolle
finden können, braucht das System
eine gut strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das "Cyber Security Network".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Informationen korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - OPERATOR
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen im sicheren Netzwerk"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Cyber-Team
- Sicherheitsprotokolle

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Cyber Security Network"

=====================================================
MITTLERE AUFGABE: STUFE 2 - SECURITY-ANALYST
=====================================================

Erweitert eure Seite um einen Abschnitt
über das Cyber-Team.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Alex, der Netzwerk-Analyst"

Absatz:
"Alex überwacht den Netzwerkverkehr
und sucht nach <strong>verdächtigen Aktivitäten</strong>."

Artikel 2:
Überschrift:
"Mia, die Sicherheits-Expertin"

Absatz:
"Mia schützt wichtige Daten
und überprüft <strong>Sicherheitslücken</strong>
im System."

=====================================================
SCHWERE AUFGABE: STUFE 3 - CYBER-EXPERTE
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen Sicherheits-Tipp.

Beispiel:

Überschrift:
"Cyber-Tipp"

Absatz:
"Verwende sichere Passwörter!

Und vergiss nicht, auch deine HTML-Tags zu schließen."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - MASTER-OPERATOR
=====================================================

Baut eine kleine "Cyber-Missions-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation für das Netzwerk bauen
- Cyber-Team im Main-Bereich vorstellen
- Cyber-Tipp als Aside einfügen
- Sicherheitsprotokolle überprüfen
- Verdächtige Aktivitäten melden

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Cyber-Team</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein sicheres Netzwerk:
Header, Main und Footer bilden die Grundstruktur.
Wenn ein Tag fehlt, kann das ganze System chaotisch werden."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code sicher bleiben.
Und möge kein Bug eure Firewall überwinden!

===================================================== -->
