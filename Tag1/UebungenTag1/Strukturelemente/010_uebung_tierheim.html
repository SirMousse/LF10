<!-- =====================================================
AUFGABE: DAS HTML-TIERHEIM
=====================================================

Willkommen, Tierfreundinnen und Tierfreunde!

Im Tierheim warten viele Hunde, Katzen
und andere Tiere auf ein neues Zuhause.

Damit Besucher wichtige Informationen
über die Tiere, Pflege und Vermittlung
finden können, braucht das Tierheim
eine gut strukturierte Webseite.

Eure Aufgabe:
Erstellt eine strukturierte HTML-Seite für
das "Tierheim Sonnenpfote".

Nur wenn eure Webseite sauber aufgebaut ist,
können alle Informationen korrekt angezeigt werden.

=====================================================
PFLICHT-AUFGABE: STUFE 1 - PFOTE
=====================================================

Erstellt eine HTML-Datei mit vollständigem Boilerplate.

Eure Seite MUSS enthalten:

<!DOCTYPE html>
<html lang="de">

<head> mit:
- UTF-8
- Viewport
- passendem <title>

<body> mit:
- <header>
- <nav>
- <main>
- <footer>

Im <header>:
- Eine <h1>-Überschrift

Beispiel:
"Willkommen im Tierheim Sonnenpfote"

Im <nav>:
- Eine ungeordnete Liste <ul>
- Mindestens 3 Listenpunkte <li>
- Jeder Listenpunkt enthält einen Link <a>

Beispiel:
- Startseite
- Unsere Tiere
- Vermittlung

Im <main>:
- Mindestens eine <section>
- Eine <h2>-Überschrift
- Einen Absatz <p>

Im <footer>:
- Ein Copyright mit &copy;

Beispiel:
"© 2026 Tierheim Sonnenpfote"

=====================================================
MITTLERE AUFGABE: STUFE 2 - TIERPFLEGER
=====================================================

Erweitert eure Seite um einen Abschnitt
über die Tiere im Tierheim.

In dieser <section> sollen mindestens 2 <article>
vorkommen.

Jeder <article> enthält:

- Eine <h3>-Überschrift
- Einen Absatz <p>
- Mindestens ein wichtiges Wort mit <strong>

Beispiel:

Artikel 1:
Überschrift:
"Bello, der freundliche Hund"

Absatz:
"Bello ist ein <strong>verspielter Hund</strong>
und sucht ein liebevolles neues Zuhause."

Artikel 2:
Überschrift:
"Luna, die neugierige Katze"

Absatz:
"Luna ist eine ruhige Katze und liebt
<strong>gemütliche Schlafplätze</strong>."

=====================================================
SCHWERE AUFGABE: STUFE 3 - TIERRETTER
=====================================================

Fügt eine <aside>-Box hinzu.

Diese soll eine Zusatzinformation enthalten,
zum Beispiel einen wichtigen Tierheim-Hinweis.

Beispiel:

Überschrift:
"Tierheim-Tipp"

Absatz:
"Ein Haustier braucht Zeit, Geduld und Liebe!

Überlegt gut, bevor ihr ein Tier adoptiert."

Nutzt außerdem:

- Mindestens ein <br> für einen Zeilenumbruch
- Mindestens ein <hr> als thematische Trennlinie
- Mindestens eine Überschrift von <h1> bis <h3>

=====================================================
BOSS-LEVEL: STUFE 4 - TIERHEIM-HELD
=====================================================

Baut eine kleine "Tierheim-Aufgaben-Liste" ein.

Die Liste soll mindestens 4 Aufgaben enthalten.

Beispiel:

- Boilerplate erstellen
- Navigation für das Tierheim bauen
- Tiere im Main-Bereich vorstellen
- Tierheim-Tipp als Aside einfügen
- Einen gemütlichen Platz für jedes Tier finden

BONUS:

Verlinkt innerhalb eurer Navigation mit href="#"
auf Platzhalter-Links.

Beispiel:

<a href="#">Unsere Tiere</a>

=====================================================
EXTRA-NERD-BONUS
=====================================================

Schreibt irgendwo auf der Seite diesen Satz:

"Ein HTML-Dokument ist wie ein gutes Tierheim:
Header, Main und Footer geben allem einen festen Platz.
Wenn ein Tag fehlt, geht schnell die Ordnung verloren."

=====================================================
ZIEL DER AUFGABE
=====================================================

Am Ende habt ihr eine vollständige HTML-Seite mit:

- Boilerplate
- Header
- Navigation
- Main-Bereich
- Sections
- Articles
- Aside
- Footer
- Listen
- Links
- Absätzen und Überschriften

Möge euer Code sauber bleiben.
Und möge jedes Tier ein schönes Zuhause finden!

===================================================== -->
